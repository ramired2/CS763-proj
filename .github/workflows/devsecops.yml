name: DevSecOps

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check formatting and lint
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Scan dependencies with Trivy
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/work:ro"
          aquasec/trivy:0.68.2
          fs
          --scanners vuln
          --detection-priority comprehensive
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 0
          /work

      - name: Run Semgrep SAST
        run: semgrep scan --config p/python app tests

  container:
    name: Build container
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image
        run: docker build --tag peer-review-gateway:${GITHUB_SHA} .
