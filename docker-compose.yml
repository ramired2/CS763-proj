#
# Prompt summary: Create a docker-compose.yml file for a FastAPI application
#
# AI Contribution: 100%
#
# Human Modifications: No changes were necessary

services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
