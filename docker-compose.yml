#
# Prompt summary: Create a docker-compose.yml file for a FastAPI application and include postgresql db
#
# AI Contribution: 100%
#
# Human Modifications: No changes were necessary

services:
  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: "postgresql://eval_gateway:${POSTGRES_PASSWORD:-local-development-password}@db:5432/eval_gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eval_gateway
      POSTGRES_USER: eval_gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval_gateway -d eval_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
